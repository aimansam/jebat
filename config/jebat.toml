[server]
api_bind = "127.0.0.1:9090"
db_path = "jebat.db"
log_level = "info"
loot_dir = "loot"

[[listeners]]
protocol = "https"
bind = "0.0.0.0"
port = 443
beacon_path = "/beacon"
result_path = "/result"
tls_cert = "config/cert.pem"
tls_key = "config/key.pem"
rc4_key = "aabbccddee112233"

